[project]
name = "roco-team-builder"
version = "0.1.0"
description = "洛克王国：世界 — AI 配队助手"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=2.2",
    "deap>=1.4",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
